[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-bridge"
version = "0.2.0"
description = "Bridge between opencode on the desktop and the opencode companion app on a phone"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "websockets>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[project.scripts]
opencode-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
