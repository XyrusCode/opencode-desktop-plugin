name: Tests

# The bridge is pure Python with no build step, so CI is exactly what a
# developer runs locally: install the package with dev extras and run pytest.
# Every socket in the suite is real; only opencode itself is replaced by an
# in-process fake, so no opencode install is needed on the runner.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A hung socket test would otherwise burn the whole job budget.
      - name: Run tests
        run: pytest -q --timeout=60

      - name: Smoke-import the entry point
        # Cheap guard that `python -m bridge` still resolves after a refactor.
        run: python -c "import bridge.__main__, bridge.server, bridge.protocol; print('imports ok')"
