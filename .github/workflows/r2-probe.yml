name: R2 Probe

# Verifies the Cloudflare token can actually write to the target bucket before
# the mirroring workflow depends on it. Does a real put -> get -> delete round
# trip rather than trusting a success flag.
#
# Uses wrangler, not the R2 S3 endpoint: the S3 endpoint requires SigV4
# credentials, and the token in this repo is a Cloudflare API token.
#
# Temporary: delete once the mirror workflow is live.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: R2 bucket name
        required: true
        default: software-releases

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Diagnose credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          # Print shape, not values: a pasted secret often carries whitespace
          # or quotes, which looks identical to a permissions failure.
          python3 - <<'PY'
          import os
          acct = os.environ.get("ACCOUNT_ID", "")
          tok = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          print(f"account_id len={len(acct)} hex={acct.isalnum()} lower={acct.islower()}")
          print(f"token len={len(tok)}")
          PY

      - name: Verify token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify | head -c 500; echo

      - name: Check account
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID" | head -c 600; echo

      - name: Check bucket directly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/r2/buckets/$BUCKET" | head -c 600; echo

      - name: List buckets via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler r2 bucket list || true

      - name: Round trip a probe object
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ inputs.bucket }}
        run: |
          set -euo pipefail
          key="opencode/_probe/probe.txt"
          printf 'probe\n' > /tmp/probe-in

          echo "-> PUT"
          wrangler r2 object put "$BUCKET/$key" --file /tmp/probe-in --remote

          echo "-> GET"
          wrangler r2 object get "$BUCKET/$key" --file /tmp/probe-out --remote
          cat /tmp/probe-out

          echo "-> DELETE"
          wrangler r2 object delete "$BUCKET/$key" --remote

          echo "R2 round trip OK for '$BUCKET' in account $CLOUDFLARE_ACCOUNT_ID"
